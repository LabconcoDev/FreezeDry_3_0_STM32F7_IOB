# ==========================================
# Core Kernel & System Configuration
# ==========================================
CONFIG_NEWLIB_LIBC=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=y

# ==========================================
# Hardware Busses (I2C, SPI, GPIO)
# ==========================================
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_STM32=y
CONFIG_SPI=y

# ==========================================
# Drivers (Sensors & ADCs)
# ==========================================
CONFIG_SENSOR=y
CONFIG_MCP9600=y
CONFIG_ADC=y
CONFIG_ADC_INIT_PRIORITY=80

# ==========================================
# DMA & UART (Display Protocol)
# ==========================================
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y
CONFIG_NOCACHE_MEMORY=y

# Disable standard UART features to prevent conflicts with DMA
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n

# Optional DMA debug
CONFIG_DMA_LOG_LEVEL_DBG=y

# ==========================================
# Logging & Console (SEGGER RTT)
# ==========================================
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_ASSERT=y

# Use RTT instead of UART for logs
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n

# RTT Buffers & Threading safety
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_LOG_MODE_IMMEDIATE=n

# ==========================================
# Threading & Memory Protection
# ==========================================
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SMF=y

# MPU & Stack Guard Rails
CONFIG_MPU=y
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y

# Thread Debugging Tools
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# ==========================================
# Hardware Floating Point Unit (FPU)
# ==========================================
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048